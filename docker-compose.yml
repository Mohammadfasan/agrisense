services:
  mongo:
    image: mongo:6
    container_name: agrisense-mongo
    restart: unless-stopped
    ports:
      - '${MONGO_PORT:-27017}:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-agrisense}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-agrisense}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-agrisense}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: agrisense-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: agrisense-ml
    restart: unless-stopped
    ports:
      - '${ML_PORT:-8000}:8000'
    environment:
      ENVIRONMENT: ${NODE_ENV:-development}
      LOG_LEVEL: ${ML_LOG_LEVEL:-INFO}
      MODELS_DIR: /srv/models
    volumes:
      # Mount trained artifacts in rather than baking them into the image.
      - ./ml-service/models:/srv/models:ro
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  mongo-data:
    name: agrisense-mongo-data
  redis-data:
    name: agrisense-redis-data
