services:
  mongo:
    image: mongo:6
    container_name: agrisense-mongo
    restart: unless-stopped
    ports:
      # 127.0.0.1 only: reachable from this machine, not from everyone on the
      # same Wi-Fi. The default password below is a development one.
      - '127.0.0.1:${MONGO_PORT:-27017}:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-agrisense}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-agrisense}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-agrisense}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: agrisense-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      # 127.0.0.1 only: this Redis has no password.
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: agrisense-ml
    restart: unless-stopped
    ports:
      # 127.0.0.1 only: only the Node API should call this service.
      - '127.0.0.1:${ML_PORT:-8000}:8000'
    # INTERNAL_API_KEY lives here, never in the image (.dockerignore excludes
    # .env). Compose refuses to start if the file is missing.
    env_file:
      - ./ml-service/.env
    environment:
      # These win over the same names in the env_file.
      ENVIRONMENT: ${NODE_ENV:-development}
      LOG_LEVEL: ${ML_LOG_LEVEL:-INFO}
      MODELS_DIR: /models
    volumes:
      # The model is fetched from the GitHub Release on first start (ADR-00Y)
      # and kept here, so later starts only verify its hash.
      - ml-models:/models
    # The healthcheck is defined once, in the Dockerfile: it calls /ready,
    # which is 200 only when the model is loaded and verified.

volumes:
  mongo-data:
    name: agrisense-mongo-data
  redis-data:
    name: agrisense-redis-data
  ml-models:
    name: agrisense-ml-models
